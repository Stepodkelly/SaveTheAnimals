openapi: 3.1.0
info:
  title: SaveTheAnimals V2 Forecast API
  version: 0.2.0
  description: Replay-first MVP contract for prototype flood-risk surfaces, road risk and evidence-backed route explanation.
servers:
  - url: http://127.0.0.1:4173/api
    description: Local development API
paths:
  /v2/events:
    get:
      summary: List reviewed flood events
      responses:
        "200":
          description: Event list
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/FloodEvent"
  /v2/events/{id}:
    get:
      summary: Get one flood event
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Event detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FloodEvent"
        "404":
          $ref: "#/components/responses/NotFound"
  /v2/scenes:
    get:
      summary: List catalogued satellite scenes
      responses:
        "200":
          description: Scene list
          content:
            application/json:
              schema:
                type: object
                required: [scenes]
                properties:
                  scenes:
                    type: array
                    items:
                      $ref: "#/components/schemas/SatelliteScene"
  /v2/forecast-runs:
    post:
      summary: Create a forecast or replay run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateForecastRunRequest"
      responses:
        "202":
          description: Forecast job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "422":
          $ref: "#/components/responses/ValidationError"
  /v2/forecast-runs/{id}:
    get:
      summary: Get forecast run status
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Forecast run status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastRun"
        "404":
          $ref: "#/components/responses/NotFound"
  /v2/forecast-runs/{id}/summary:
    get:
      summary: Get forecast summary for map and side panel rendering
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Forecast summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastSummary"
        "404":
          $ref: "#/components/responses/NotFound"
  /v2/forecast-runs/{id}/tiles/{scenario}/{z}/{x}/{y}:
    get:
      summary: Get forecast probability tile
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: scenario
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Scenario"
        - name: z
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
        - name: x
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
        - name: y
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Raster tile
          content:
            image/png:
              schema:
                type: string
                contentEncoding: binary
        "404":
          $ref: "#/components/responses/NotFound"
  /v2/routes:
    post:
      summary: Create a provisional lower-risk mapped-road route
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRouteRequest"
      responses:
        "202":
          description: Route job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "422":
          $ref: "#/components/responses/ValidationError"
  /v2/routes/{id}:
    get:
      summary: Get route result
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Route result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteResult"
        "404":
          $ref: "#/components/responses/NotFound"
  /v2/evidence:
    get:
      summary: List evidence claims
      parameters:
        - name: forecastRunId
          in: query
          schema:
            type: string
        - name: routeId
          in: query
          schema:
            type: string
        - name: verificationStatus
          in: query
          schema:
            $ref: "#/components/schemas/EvidenceVerificationStatus"
      responses:
        "200":
          description: Evidence claim list
          content:
            application/json:
              schema:
                type: object
                required: [claims]
                properties:
                  claims:
                    type: array
                    items:
                      $ref: "#/components/schemas/EvidenceClaim"
  /v2/replays/{id}/evaluation:
    get:
      summary: Get historical replay evaluation
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Replay evaluation report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayEvaluation"
        "404":
          $ref: "#/components/responses/NotFound"
  /v2/admin/evidence-searches:
    post:
      summary: Start an evidence search job
      responses:
        "202":
          description: Evidence search job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
  /v2/admin/review/events:
    get:
      summary: List events awaiting review
      responses:
        "200":
          description: Review queue
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/FloodEvent"
  /v2/admin/review/import-overrides:
    post:
      summary: Import human review overrides
      responses:
        "202":
          description: Import accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
  /v2/admin/review/export:
    get:
      summary: Export review data
      responses:
        "200":
          description: Review archive
          content:
            application/zip:
              schema:
                type: string
                contentEncoding: binary
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Scenario:
      type: string
      enum: [mean, lower, upper, confidence]
    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]
    JobAccepted:
      type: object
      required: [jobId, status]
      properties:
        jobId:
          type: string
        status:
          $ref: "#/components/schemas/JobStatus"
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    FloodEvent:
      type: object
      required: [id, name, status, startDate, endDate]
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [candidate, needs_review, confirmed, rejected, superseded]
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        notes:
          type: string
    SatelliteScene:
      type: object
      required: [id, source, observedAt, product, aoiCoverage]
      properties:
        id:
          type: string
        source:
          type: string
          enum: [sentinel_1, sentinel_2, landsat, cems_gfm, hydrafloods]
        observedAt:
          type: string
          format: date-time
        product:
          type: string
        aoiCoverage:
          type: number
          minimum: 0
          maximum: 1
    CreateForecastRunRequest:
      type: object
      required: [aoiId, asOf, validAt, latestObservationId, rainfallForecastId, mode]
      properties:
        aoiId:
          type: string
        asOf:
          type: string
          format: date-time
        validAt:
          type: string
          format: date-time
        latestObservationId:
          type: string
        rainfallForecastId:
          type: string
        mode:
          type: string
          enum: [live, replay]
        replayManifestId:
          type: string
    ForecastRun:
      type: object
      required: [id, status, mode, asOf, validAt, gridVersion, manifestId]
      properties:
        id:
          type: string
        status:
          $ref: "#/components/schemas/JobStatus"
        mode:
          type: string
          enum: [live, replay]
        asOf:
          type: string
          format: date-time
        validAt:
          type: string
          format: date-time
        gridVersion:
          type: string
        manifestId:
          type: string
        modelVersions:
          type: array
          items:
            type: string
    ForecastSummary:
      type: object
      required:
        - forecastRunId
        - displayMode
        - asOf
        - validAt
        - observationAgeDays
        - confidence
        - scenarioTiles
        - dominantFactors
        - provenance
      properties:
        forecastRunId:
          type: string
        displayMode:
          type: string
          enum: [live, cached, simulated, replayed]
        asOf:
          type: string
          format: date-time
        validAt:
          type: string
          format: date-time
        observationAgeDays:
          type: number
        confidence:
          type: number
          minimum: 0
          maximum: 1
        scenarioTiles:
          type: object
          required: [mean, lower, upper, confidence]
          properties:
            mean:
              type: string
            lower:
              type: string
            upper:
              type: string
            confidence:
              type: string
        dominantFactors:
          type: array
          items:
            type: string
            enum:
              - current_flood_connected
              - rainfall_forecast
              - historical_frequency
              - low_hand
              - spatial_smoothing
              - low_confidence
              - observation_age
        roadRisk:
          type: array
          items:
            $ref: "#/components/schemas/RoadRiskSegment"
        provenance:
          type: array
          items:
            $ref: "#/components/schemas/ProvenanceItem"
    RoadRiskSegment:
      type: object
      required: [segmentId, roadName, observedStatus, validationStatus, forecastRisk, confidence, fieldVerificationRequired]
      properties:
        segmentId:
          type: string
        roadName:
          type: string
        observedStatus:
          type: string
          enum: [clear_observed, observed_open_water_overlap, unknown]
        validationStatus:
          type: string
          enum: [clear_observed, observed_open_water_overlap, unknown]
        forecastRisk:
          type: number
          minimum: 0
          maximum: 1
        confidence:
          type: number
          minimum: 0
          maximum: 1
        floodedOverlapMeters:
          type: number
          minimum: 0
        nearestFloodMeters:
          type: number
          minimum: 0
        fieldVerificationRequired:
          type: boolean
    CreateRouteRequest:
      type: object
      required: [forecastRunId, origin, destination, safetyPolicy]
      properties:
        forecastRunId:
          type: string
        origin:
          $ref: "#/components/schemas/Point"
        destination:
          $ref: "#/components/schemas/Point"
        safetyPolicy:
          type: string
          enum: [balanced, conservative, emergency_no_block_without_observed_water]
    RouteResult:
      type: object
      required: [id, status, routeStatus, fieldVerificationRequired, explanation]
      properties:
        id:
          type: string
        status:
          $ref: "#/components/schemas/JobStatus"
        routeStatus:
          type: string
          enum: [route_found, no_mapped_route, pending, failed]
        geojson:
          type: object
          additionalProperties: true
        totalDistanceKm:
          type: number
        additionalDistanceKm:
          type: number
        maximumSegmentRisk:
          type: number
          minimum: 0
          maximum: 1
        fieldVerificationRequired:
          type: boolean
        explanation:
          type: array
          items:
            type: string
        roadRiskSegments:
          type: array
          items:
            $ref: "#/components/schemas/RoadRiskSegment"
    EvidenceVerificationStatus:
      type: string
      enum: [unverified, official, operator_reviewed, field_verified]
    EvidenceClaim:
      type: object
      required: [id, text, sourceUrl, sourceTitle, verificationStatus, createdAt]
      properties:
        id:
          type: string
        text:
          type: string
        sourceUrl:
          type: string
          format: uri
        sourceTitle:
          type: string
        relatesToAssetId:
          type: string
        verificationStatus:
          $ref: "#/components/schemas/EvidenceVerificationStatus"
        createdAt:
          type: string
          format: date-time
    ReplayEvaluation:
      type: object
      required: [replayId, asOf, validAt, manifestId, metrics, baselines, leakageAudit]
      properties:
        replayId:
          type: string
        asOf:
          type: string
          format: date-time
        validAt:
          type: string
          format: date-time
        manifestId:
          type: string
        metrics:
          type: object
          required: [brierScore, calibrationError, roadImpactRecall, falseSafeRoadRate, unnecessaryBlockRate, routeAvailability]
          properties:
            brierScore:
              type: number
            calibrationError:
              type: number
            roadImpactRecall:
              type: number
            falseSafeRoadRate:
              type: number
            unnecessaryBlockRate:
              type: number
            routeAvailability:
              type: number
        baselines:
          type: array
          items:
            type: string
        leakageAudit:
          type: object
          required: [passed, checks]
          properties:
            passed:
              type: boolean
            checks:
              type: array
              items:
                type: string
    ProvenanceItem:
      type: object
      required: [assetId, role, availableAt]
      properties:
        assetId:
          type: string
        role:
          type: string
        availableAt:
          type: string
          format: date-time
        sourceUrl:
          type: string
          format: uri
    Point:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
        longitude:
          type: number
